name: Mise à jour automatique des radiosondages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Téléchargement des 5 sondages français
        run: python maj_sondages.py

      - name: Sauvegarde des nouveaux fichiers CSV
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "MeteoBot"
          git add donnees/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour auto des sondages" && git pull --rebase && git push)

      - name: Préparation du site pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publication automatique sur le web
        id: deployment
        uses: actions/deploy-pages@v4
