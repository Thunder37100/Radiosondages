name: Mise à jour automatique des radiosondages

on:
  schedule:
    # Exécution automatique à 02h15 UTC et 14h15 UTC (après publication des runs 00Z et 12Z)
    - cron: '15 2,14 * * *'
  workflow_dispatch: # Permet aussi de lancer le robot manuellement d'un clic sur GitHub !

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Téléchargement des 5 sondages français
        run: python maj_sondages.py

      - name: Sauvegarde des nouveaux fichiers CSV sur le site
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "MeteoBot"
          git add donnees/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour auto des sondages" && git push)
